# Render Free web service + external PostgreSQL database (e.g. Neon).
services:
  - type: web
    name: basketball-tournament
    env: node
    region: singapore
    plan: free

    # Migrations run against the external database during build because Free
    # services do not support pre-deploy/release commands or persistent disks.
    buildCommand: npm run build && npm --prefix server run prisma:migrate:deploy && npm --prefix server run seed && npm --prefix server run admin:create
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      # Add the pooled/direct PostgreSQL URLs and admin credentials in Dashboard.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Tournament Administrator
